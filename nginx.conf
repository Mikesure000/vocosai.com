# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name vocosai.com www.vocosai.com;
    return 301 https://vocosai.com$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name vocosai.com;

    # SSL certificates (use Let's Encrypt / certbot)
    # ssl_certificate     /etc/letsencrypt/live/vocosai.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vocosai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend static files
    root /opt/vocosai/frontend/dist;
    index index.html;

    # API proxy to backend
    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
    gzip_min_length 256;
}

# Local development / Docker compose fallback
server {
    listen 80;
    server_name localhost;

    root /app/public;
    index index.html;

    location /health { proxy_pass http://backend:3000; }
    location /api/ { proxy_pass http://backend:3000; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length 256;
}
