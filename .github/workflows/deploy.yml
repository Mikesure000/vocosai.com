name: Deploy to vocosai.com

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npx vite build
          test -f dist/index.html || { echo "BUILD FAILED"; exit 1; }
          echo "Frontend built successfully"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host vocos" >> ~/.ssh/config
          echo "  HostName ${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/config
          echo "  User ${{ secrets.DEPLOY_USER }}" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            backend/src/ vocos:/opt/vocosai/backend/src/
          rsync -avz \
            backend/db/ vocos:/opt/vocosai/backend/db/
          rsync -avz \
            backend/package.json vocos:/opt/vocosai/backend/package.json
          rsync -avz --delete \
            frontend/dist/ vocos:/opt/vocosai/frontend/dist/
          echo "Deployed successfully"

      - name: Restart service
        run: |
          ssh vocos "
            cd /opt/vocosai/backend
            npm install --omit=dev
            systemctl restart vocos-node
            sleep 3
            curl -s --max-time 5 http://127.0.0.1:3000/health
          "
