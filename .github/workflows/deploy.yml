name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment secrets
        env:
          VOCOS_SSH_HOST: ${{ secrets.VOCOS_SSH_HOST }}
          VOCOS_SSH_USER: ${{ secrets.VOCOS_SSH_USER }}
          VOCOS_SSH_KEY: ${{ secrets.VOCOS_SSH_KEY }}
        run: |
          test -n "$VOCOS_SSH_HOST"
          test -n "$VOCOS_SSH_USER"
          test -n "$VOCOS_SSH_KEY"

      - name: Deploy over SSH
        env:
          VOCOS_SSH_HOST: ${{ secrets.VOCOS_SSH_HOST }}
          VOCOS_SSH_USER: ${{ secrets.VOCOS_SSH_USER }}
          VOCOS_SSH_KEY: ${{ secrets.VOCOS_SSH_KEY }}
          VOCOS_SSH_PORT: ${{ secrets.VOCOS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VOCOS_SSH_KEY" > ~/.ssh/vocos_key
          chmod 600 ~/.ssh/vocos_key
          ssh-keyscan -p "$VOCOS_SSH_PORT" "$VOCOS_SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vocos_key -p "$VOCOS_SSH_PORT" "$VOCOS_SSH_USER@$VOCOS_SSH_HOST" \
            "set -euo pipefail; curl -fsSL https://raw.githubusercontent.com/Mikesure000/vocosai.com/main/fullstack/deploy/deploy-vocos.sh -o /tmp/deploy-vocos.sh; sudo bash /tmp/deploy-vocos.sh"
