name: Feature request
description: Propose a product, backend, or deployment improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or team problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the expected behavior or workflow.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Frontend, backend, AI pipeline, deployment, docs, or data.
